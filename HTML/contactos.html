<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Contacto || Pixel & play</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/styleContacto.css">
</head>

<body>
        <header>
        <nav>
            <div class="logo" href="index.html">Pixel & Play</div>
            <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="contactos.html">Contacto</a></li>
            <li><a href="productos.html">Productos</a></li>
            </ul>
        </nav>
    </header>

    <form id="form-contacto">

        <label for="nombre">Nombre completo:</label>
        <input type="text" id="nombre" name="nombre" maxlength="100">
        <p id="fallo-nombre"></p>

        <label for="correo">Correo electronico:</label>
        <input type="email" id="correo" name="correo" maxlength="100">
        <p id="fallo-correo"></p>

        <label for="mensaje">Mensaje:</label>
        <textarea id="mensaje" maxlength="500"></textarea>
        <p id="fallo-mensaje"></p>

        <button type="submit">Enviar mensaje</button>
        <p id ="mensaje-exito"></p>

    </form>

    <script src="../JS/contactos.js"></script>

</body>

</html>
